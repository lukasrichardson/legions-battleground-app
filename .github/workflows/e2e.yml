name: End-to-end tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  e2e:
    # `ubuntu-latest` moved to a 6.19 kernel, which MongoDB deliberately
    # refuses to start on. Keep this test service on the supported 24.04 image.
    runs-on: ubuntu-24.04
    # Include browser installation and leave time to upload timeout diagnostics.
    timeout-minutes: 30
    services:
      mongodb:
        image: mongo:8.0
        # MongoDB's TCMalloc startup guard rejects current hosted-runner kernels
        # unless glibc rseq is enabled. Keep this scoped to the E2E database.
        env:
          GLIBC_TUNABLES: glibc.pthread.rseq=1
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: true
      E2E_MONGO_URL: mongodb://127.0.0.1:27017
      E2E_MONGO_DB_NAME: legions_battleground_e2e
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: e2e-only-not-for-production
      E2E_TEST_MODE: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - name: Upload Playwright report and failure evidence
        if: ${{ always() }}
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
