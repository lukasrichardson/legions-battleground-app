name: E2E benchmark (optional)

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Shard configuration to benchmark
        required: true
        type: choice
        default: 2-file
        options:
          - 2-file
          - 4-file
          - 4-test

permissions:
  contents: read

jobs:
  inventory:
    name: Compare shard inventories
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CI: true
      E2E_MONGO_URL: mongodb://127.0.0.1:27017
      E2E_MONGO_DB_NAME: legions_battleground_e2e
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: e2e-only-not-for-production
      E2E_TEST_MODE: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm ci
      - run: node scripts/e2e-shard-inventory.mjs
      - name: Upload inventory
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-inventory
          path: .scratch/e2e-benchmark/inventory.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  benchmark:
    name: Benchmark ${{ inputs.configuration }} shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.configuration == '2-file' && '[1,2]' || '[1,2,3,4]') }}
    services:
      mongodb:
        image: mongo:8.0
        env:
          GLIBC_TUNABLES: glibc.pthread.rseq=1
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: true
      E2E_MONGO_URL: mongodb://127.0.0.1:27017
      E2E_MONGO_DB_NAME: legions_battleground_e2e
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: e2e-only-not-for-production
      E2E_TEST_MODE: true
      E2E_BENCHMARK_TEST_SHARDING: ${{ inputs.configuration == '4-test' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run benchmark shard
        env:
          SHARD: ${{ matrix.shard }}
          SHARD_COUNT: ${{ inputs.configuration == '2-file' && '2' || '4' }}
        run: node scripts/e2e-benchmark.mjs --shard="$SHARD/$SHARD_COUNT"
      - name: Upload timings
        if: ${{ always() }}
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-timings-${{ inputs.configuration }}-${{ matrix.shard }}
          path: |
            .scratch/e2e-benchmark/timings.jsonl
            .scratch/e2e-benchmark/summary.md
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
      - name: Upload Playwright evidence
        if: ${{ always() }}
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-report-${{ inputs.configuration }}-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
